<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="analysis.css">
</head>
<body>
<div class="dashboard">
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-box">FN</div>
            <h3>FYP Nexus</h3>
        </div>
        <nav class="sidebar-menu">
            <a href="dashboard.html"><span>⌂</span> Home</a>
            <a href="analysis.html" class="active"><span>✦</span> New Analysis</a>
            <a href="results.html"><span>⌕</span>Results</a>
            <a href="report.html"> <span>▣</span>Report</a>
            <a href="history.html"><span>◷</span>History</a>
        </nav>
<!-- student profile -->
        <div class="student-profile">
            <div class="profile-circle">S </div>
            <div>
                <strong>Student</strong>
                <small>student@university.edu.pk</small>
            </div>
        </div>
<!-- logout -->
        <a href="#" class="logout" id="logoutBtn"> ↪ Log out</a>
    </aside>
<!-- main_content -->
    <main class="main-content">
        <div class="analysis-container">
            <div class="analysis-header">
                <div class="modal-logo">FN</div>
                <h1>New Proposal Analysis</h1>
                <p>
                    Enter your project details to check its uniqueness
                    and get suggestions for improvement.
                </p>
            </div>
            <div class="analysis-card">
                <form id="analysisForm">
                    <label for="projectTitle">Project Title</label>
                    <input type="text" id="projectTitle" placeholder="Enter your proposed project title" required>
                    <label for="description">Project Description </label>
                    <textarea  id="description"rows="4"placeholder="Describe your project idea..." required></textarea>
                    <label for="problem"> Problem Statement</label>
                    <textarea id="problem" rows="3"placeholder="What problem does your project solve?"required></textarea>
                    <label for="objectives">Project Objectives</label>
                    <textarea id="objectives" rows="3"placeholder="Enter the main objectives of your project..."required></textarea>
                    <label for="technology"> Technologies / Tools </label>
                    <input type="text" id="technology" placeholder="e.g. HTML, CSS, JavaScript, Python">
                    <label for="category"> Project Category </label>
                    <select id="category" required>
                        <option value=""> Select Category</option>
                        <option>Web Development</option>
                        <option>Mobile Application</option>
                        <option>Artificial Intelligence</option>
                        <option>Machine Learning</option>
                        <option>Blockchain</option>
                        <option>Cyber Security</option>
                        <option>IoT</option>
                        <option>Other</option>
                    </select>
                    <button type="submit" class="analyze-btn">Analyze Proposal </button>
                </form>
            </div>
        </div>
    </main>
</div>
<script src="analysis.js"></script>
</body>
</html>
